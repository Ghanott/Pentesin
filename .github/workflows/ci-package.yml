name: Package

on:
  workflow_call:

permissions:
  contents: read

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00  # v6.0.0
        with:
          go-version-file: pentesin/interface/tui/go.mod
          cache-dependency-path: pentesin/interface/tui/go.sum
      - uses: ./.github/actions/setup-python-env
      - run: uv build --wheel
      - name: Wheel ships the TUI sidecar and the viewer bundle
        run: |
          uv run --frozen python - <<'PY'
          import glob, zipfile
          (wheel,) = glob.glob("dist/*.whl")
          names = zipfile.ZipFile(wheel).namelist()
          assert "pentesin/bin/pentesin-tui" in names, names
          assert "pentesin/interface/viewer/static/index.html" in names, names
          assert not any(name.startswith("pentesin/interface/viewer/frontend/") for name in names)
          assert not any(name.startswith("pentesin/interface/tui/cmd/") for name in names)
          PY
      - name: Install into a clean environment and run the CLI
        run: |
          uv venv --python 3.12 /tmp/pentesin-smoke
          uv pip install --python /tmp/pentesin-smoke/bin/python dist/*.whl
          /tmp/pentesin-smoke/bin/pentesin --version
          /tmp/pentesin-smoke/bin/pentesin --help >/dev/null
      - name: Vertex AI and Bedrock dependencies install with the wheel
        run: /tmp/pentesin-smoke/bin/python -c "import google.auth.transport.requests, boto3"

  binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00  # v6.0.0
        with:
          go-version-file: pentesin/interface/tui/go.mod
          cache-dependency-path: pentesin/interface/tui/go.sum
      - uses: ./.github/actions/setup-python-env
      - run: make tui-build
      - run: uv run --frozen pyinstaller pentesin.spec --noconfirm
      - run: dist/pentesin --version
      - name: Binary bundles the TUI sidecar and the provider dependencies
        run: |
          uv run --frozen pyi-archive_viewer -l -r dist/pentesin > archive.txt
          grep -E "pentesin/bin/pentesin-tui" archive.txt >/dev/null
          grep -E "'google\.auth\.transport\.requests'" archive.txt >/dev/null
          grep -E "'boto3\.session'" archive.txt >/dev/null
      - name: Binary reaches Vertex AI and Bedrock authentication
        env:
          PENTESIN_TELEMETRY: "false"
          PENTESIN_IMAGE: alpine:3.20
          VERTEXAI_PROJECT: pentesin-ci
          VERTEXAI_LOCATION: us-central1
          AWS_REGION: us-east-1
        run: |
          mkdir -p /tmp/target && echo 'print("hi")' > /tmp/target/app.py
          PENTESIN_LLM=vertex_ai/gemini-2.5-pro dist/pentesin -n -t /tmp/target --scan-mode quick > vertex.log 2>&1 || true
          grep -q "DefaultCredentialsError" vertex.log
          if grep -q "No module named" vertex.log; then exit 1; fi
          PENTESIN_LLM=bedrock/anthropic.claude-3-5-sonnet-20240620-v1:0 dist/pentesin -n -t /tmp/target --scan-mode quick > bedrock.log 2>&1 || true
          grep -q "Unable to locate credentials" bedrock.log
          if grep -q "No module named" bedrock.log; then exit 1; fi
